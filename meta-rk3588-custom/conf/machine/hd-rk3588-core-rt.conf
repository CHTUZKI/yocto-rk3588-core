#@TYPE: Machine
#@NAME: HD-RK3588-CORE (PREEMPT_RT)
#@DESCRIPTION: Vanxak HD-RK3588-CORE with PREEMPT_RT kernel (GPU/NPU disabled)

require conf/machine/hd-rk3588-core.conf

MACHINEOVERRIDES .= ":rt"
RK3588_KERNEL_RT = "1"

# Keep update.img deploy path aligned with the default machine name.
DEPLOY_DIR_IMAGE = "${TMPDIR}/deploy/images/hd-rk3588-core"

LINUX_VERSION_EXTENSION = "-rockchip-rt"
